<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - ColmadoYa!</title>
</head>
<body>

    <h1>Realizar pedido</h1>

    <!-- INICIO: formulario de pedido -->
    <form action="#" method="post">

        <!--  datos del cliente -->
        <fieldset>
            <legend>Datos del cliente</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <br><br>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>

            <br><br>

            <!-- selección del barrio -->
            <label for="barrio">Barrio:</label>
            <select id="barrio" name="barrio" required>

                <option value="" selected disabled>
                    Selecciona tu barrio
                </option>

                <optgroup label="Santiago de los Caballeros">
                    <option value="los-jardines">Los Jardines</option>
                    <option value="villa-olga">Villa Olga</option>
                    <option value="cerro-alto">Cerro Alto</option>
                    <option value="gurabo">Gurabo</option>
                    <option value="bella-vista">Bella Vista</option>
                </optgroup>

                <optgroup label="Otros sectores de Santiago">
                    <option value="ensanche-libertad">Ensanche Libertad</option>
                    <option value="los-salados">Los Salados</option>
                    <option value="ciudad-nueva">EL ejido</option>
                    <option value="pueblo-nuevo">Pueblo Nuevo</option>
                </optgroup>

            </select>

        </fieldset>

        <br>

        <!-- productos del pedido -->
        <fieldset>
            <legend>Productos del pedido</legend>

            <label for="producto">Producto:</label>
            <input list="productos" id="producto" name="producto" required>

            <datalist id="productos">
                <option value="Arroz">
                <option value="Habichuelas">
                <option value="Leche">
                <option value="Pan">
                <option value="Aceite">
            </datalist>

            <br><br>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required>

        </fieldset>

        <br>

        <!-- nota del pedido -->
        <fieldset>
            <legend>Nota del pedido</legend>

            <label for="nota">Nota:</label>
            <br>

            <textarea id="nota" name="nota" rows="5" cols="40"></textarea>

        </fieldset>

        <br>

        <!--progreso del pedido -->
        <label for="progreso">Progreso del pedido:</label>

        <progress id="progreso" value="50" max="100">
            50%
        </progress>

        <br><br>

        <button type="submit">Enviar pedido</button>

    </form>
    <!-- formulario de pedido -->

</body>
</html>
