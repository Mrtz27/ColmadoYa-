<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precios - ColmadoYa!</title>
</head>
<body>

    <h1>Precios de ColmadoYa!</h1>

    <!-- INICIO: tabla de precios -->
    <table>
        <caption>Precios de productos de ColmadoYa!</caption>

        <thead>
            <!-- Cabeza: títulos de la tabla -->
            <tr>
                <th>Categoría</th>
                <th>Producto</th>
                <th>Precio</th>
            </tr>
        </thead>

        <tbody>
            <!-- Cuerpo: datos de los productos -->
            <tr>
                <td rowspan="2">Granos</td>
                <td>Arroz (lb)</td>
                <td>RD$ 35</td>
            </tr>

            <tr>
                <td>Habichuelas (lb)</td>
                <td>RD$ 60</td>
            </tr>
        </tbody>

        <tfoot>
            <!-- Pie: total de ejemplo -->
            <tr>
                <td colspan="2">Total de ejemplo</td>
                <td>RD$ 95</td>
            </tr>
        </tfoot>

    </table>
    <!-- FIN: tabla de precios -->

</body>
</html>
